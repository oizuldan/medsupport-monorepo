services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - '8000:8000'
    env_file:
      - apps/server/src/config/.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 300M
  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    ports:
      - '1337:1337'
    env_file:
      - apps/cms/.env
    volumes:
      - ./apps/cms/public/uploads:/app/public/uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 800M
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # next.config.mjs inlines these at build time, so they must be passed as
      # build args too — env_file below only covers runtime.
      args:
        BASE_URL: ${BASE_URL}
        API_BASE_URL: ${API_BASE_URL}
        CMS_GRAPHQL_API_URL: ${CMS_GRAPHQL_API_URL}
        GA_TRACKING_ID: ${GA_TRACKING_ID}
        GOOGLE_COUNTER_ID: ${GOOGLE_COUNTER_ID}
        YM_COUNTER_ID: ${YM_COUNTER_ID}
    ports:
      - '3000:3000'
    env_file:
      - apps/web/.env
    depends_on:
      - server
      - cms
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 800M